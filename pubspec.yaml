name: xue_hua_navite_cache_manager
description: "Flutter native network file cache with CachedNetworkImage, HTTP 304 revalidation, LRU/LFU/FIFO/TTL eviction, MD5/SHA-256 checksums, and progress."
version: 1.1.3
homepage: https://github.com/Matkurban/xue_hua_navite_cache_manager
repository: https://github.com/Matkurban/xue_hua_navite_cache_manager
issue_tracker: https://github.com/Matkurban/xue_hua_navite_cache_manager/issues

topics:
  - cache
  - network
  - download
  - storage
  - file-cache

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_cache_manager
        pluginClass: XueHuaNaviteCacheManagerPlugin
      ios:
        pluginClass: XueHuaNaviteCacheManagerPlugin
      linux:
        pluginClass: XueHuaNaviteCacheManagerPlugin
      macos:
        pluginClass: XueHuaNaviteCacheManagerPlugin
      windows:
        pluginClass: XueHuaNaviteCacheManagerPluginCApi
      web:
        pluginClass: XueHuaNaviteCacheManagerWeb
        fileName: xue_hua_navite_cache_manager_web.dart
